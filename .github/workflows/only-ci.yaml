name: ci-only

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Setup faas-cli
        run: curl -sSL https://cli.openfaas.com | sh
      - name: Make all
        run: make all